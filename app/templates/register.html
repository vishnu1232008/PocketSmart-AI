{% extends "base.html" %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px;">
    
    <!-- PocketSmart Logo Header -->
    <div style="text-align: center; margin-bottom: 25px;">
        <h1 style="font-size: 32px; font-weight: 800; color: #1e3a8a; margin: 0 0 5px 0;">PocketSmart</h1>
        <p style="font-size: 14px; color: #475569; font-weight: 600; margin: 0;">AI-Powered Budget Planning</p>
    </div>

    <!-- Register Form Card -->
    <div style="background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 35px 30px; width: 100%; max-width: 400px; border: 1px solid #e2e8f0; box-sizing: border-box;">
        
        <h2 style="text-align: center; font-size: 22px; font-weight: 700; color: #0f172a; margin-top: 0; margin-bottom: 25px;">Create Your Account</h2>
        
        <form action="/register" method="post">
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Username</label>
                <input type="text" name="username" placeholder="Choose a username" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Email</label>
                <input type="email" name="email" placeholder="Enter your email" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Password</label>
                <input type="password" name="password" placeholder="Create a strong password" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 22px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm your password" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; box-sizing: border-box;">
            </div>

            <button type="submit" style="width: 100%; background: #1e3a8a; color: white; border: none; padding: 12px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer;">
                Create Account 👤+
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: #64748b;">
            Already have an account? <a href="/login" style="color: #1e3a8a; font-weight: 600; text-decoration: none;">Sign In</a>
        </div>

    </div>

</div>
{% endblock %}
